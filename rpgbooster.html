  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Card foil effects */
    .foil-effect {
      position: relative;
      overflow: hidden;
    }
    .foil-effect::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.25) 35%,
        rgba(255, 0, 128, 0.25) 45%,
        rgba(0, 255, 200, 0.25) 55%,
        rgba(255, 215, 0, 0.25) 65%,
        transparent 80%
      );
      transform: rotate(-25deg);
      pointer-events: none;
      animation: foilShimmer 4s infinite linear;
    }

    @keyframes foilShimmer {
      0% { transform: translateY(-30%) rotate(-25deg); }
      100% { transform: translateY(30%) rotate(-25deg); }
    }

    /* 3D Card Flip */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Pack Tear Animation */
    .pack-tear-top {
      transition: transform 0.5s ease-in-out, opacity 0.5s ease;
    }
    .pack-opened .pack-tear-top {
      transform: translateY(-120px) rotate(-10deg) scale(0.9);
      opacity: 0;
    }
    .pack-opened .pack-body {
      transform: translateY(40px) scale(0.95);
      opacity: 0;
      transition: all 0.6s ease-in-out 0.2s;
    }
  </style>
</head>

    // Helper: Parse XML into JS Card Objects
    function parseXMLDatabase(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, "text/xml");
      const cardNodes = xmlDoc.getElementsByTagName("card");
      const cards = [];

      for (let i = 0; i < cardNodes.length; i++) {
        const node = cardNodes[i];
        const name = node.getElementsByTagName("name")[0]?.textContent || "Unnamed Card";
        const setNode = node.getElementsByTagName("set")[0];
        const rarity = setNode?.getAttribute("rarity") || "common";
        const picURL = setNode?.getAttribute("picURL") || "";
        const color = node.getElementsByTagName("color")[0]?.textContent || "";
        const manacost = node.getElementsByTagName("manacost")[0]?.textContent || "";
        const cmc = parseInt(node.getElementsByTagName("cmc")[0]?.textContent || "0", 10);
        const type = node.getElementsByTagName("type")[0]?.textContent || "Card";
        const pt = node.getElementsByTagName("pt")[0]?.textContent || "";
        const text = node.getElementsByTagName("text")[0]?.textContent || "";

        // Double-sided detection based on XML text or specific card names
        const isDoubleSided = text.includes("---") || text.includes("(Back)");
        let backDetails = null;

        if (isDoubleSided) {
          const splitText = text.split("---");
          const frontText = splitText[0].trim();
          const backText = splitText[1] ? splitText[1].trim() : "Back side of card";
          backDetails = {
            name: name + " (Back)",
            text: backText,
            type: type
          };
        }

        cards.push({
          id: i + 1,
          name,
          rarity: rarity.toLowerCase(),
          picURL,
          color: color || "C",
          manacost,
          cmc,
          type,
          pt,
          text,
          isDoubleSided,
          backDetails
        });
      }
      return cards;
    }

    // --- Main App Component ---
    function App() {
      const [cards, setCards] = useState([]);
      const [currentPack, setCurrentPack] = useState([]);
      const [revealedIndices, setRevealedIndices] = useState(new Set());
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('mtg_rpg_inventory');
        return saved ? JSON.parse(saved) : {};
      });
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('mtg_rpg_stats');
        return saved ? JSON.parse(saved) : { packsOpened: 0, mythics: 0, rares: 0 };
      });
      
      const [packMode, setPackMode] = useState('pure'); // 'pure' or 'draft'
      const [isOpeningAnim, setIsOpeningAnim] = useState(false);
      const [activeTab, setActiveTab] = useState('booster'); // 'booster' | 'collection'
      
      // Collection Filter state
      const [filterRarity, setFilterRarity] = useState('all');
      const [filterColor, setFilterColor] = useState('all');
      const [filterType, setFilterType] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // Load & Parse Cards on Mount
      useEffect(() => {
        const parsed = parseXMLDatabase(RAW_XML);
        setCards(parsed);
      }, []);

      // Refresh Lucide Icons on Render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Sync inventory & stats to localStorage
      useEffect(() => {
        localStorage.setItem('mtg_rpg_inventory', JSON.stringify(inventory));
      }, [inventory]);

      useEffect(() => {
        localStorage.setItem('mtg_rpg_stats', JSON.stringify(stats));
      }, [stats]);

      // --- Booster Pack Generation Algorithm ---
      const generateBoosterPack = () => {
        if (cards.length === 0) return;

        let pack = [];
        if (packMode === 'pure') {
          // Pure Random 15 Mix
          for (let i = 0; i < 15; i++) {
            const randomIndex = Math.floor(Math.random() * cards.length);
            pack.push(cards[randomIndex]);
          }
        } else {
          // Balanced Draft Pack logic (1 Rare/Mythic, 3 Uncommons, 10 Commons, 1 Land)
          const mythicsAndRares = cards.filter(c => c.rarity === 'mythic' || c.rarity === 'rare');
          const uncommons = cards.filter(c => c.rarity === 'uncommon');
          const commons = cards.filter(c => c.rarity === 'common' && c.type !== 'Land');
          const lands = cards.filter(c => c.type === 'Land');

          // Helper safely picks random item
          const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)] || cards[0];

          // 1 Rare/Mythic
          pack.push(getRandom(mythicsAndRares.length > 0 ? mythicsAndRares : cards));

          // 3 Uncommons
          for (let i = 0; i < 3; i++) {
            pack.push(getRandom(uncommons.length > 0 ? uncommons : cards));
          }

          // 10 Commons
          for (let i = 0; i < 10; i++) {
            pack.push(getRandom(commons.length > 0 ? commons : cards));
          }

          // 1 Land
          pack.push(getRandom(lands.length > 0 ? lands : cards));
        }

        // Trigger opening foil tearing animation
        setIsOpeningAnim(true);
        setRevealedIndices(new Set());
        
        setTimeout(() => {
          setCurrentPack(pack);
          setIsOpeningAnim(false);

          // Update Stats & Inventory
          const newInventory = { ...inventory };
          let packMythics = 0;
          let packRares = 0;

          pack.forEach(card => {
            newInventory[card.name] = (newInventory[card.name] || 0) + 1;
            if (card.rarity === 'mythic') packMythics++;
            if (card.rarity === 'rare') packRares++;
          });

          setInventory(newInventory);
          setStats(prev => ({
            packsOpened: prev.packsOpened + 1,
            mythics: prev.mythics + packMythics,
            rares: prev.rares + packRares
          }));

          // Confetti if Mythic inside
          if (packMythics > 0 && window.confetti) {
            window.confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        }, 600);
      };

      const revealCard = (index) => {
        setRevealedIndices(prev => new Set(prev).add(index));
      };

      const revealAll = () => {
        const allIndices = new Set(currentPack.map((_, i) => i));
        setRevealedIndices(allIndices);
      };

      // Collection Filtering
      const filteredCollection = useMemo(() => {
        return cards.filter(card => {
          if (filterRarity !== 'all' && card.rarity !== filterRarity) return false;
          if (filterColor !== 'all' && !card.color.includes(filterColor)) return false;
          if (filterType !== 'all' && !card.type.toLowerCase().includes(filterType.toLowerCase())) return false;
          if (searchQuery && !card.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }, [cards, filterRarity, filterColor, filterType, searchQuery]);

      const uniqueCollectedCount = useMemo(() => {
        return Object.keys(inventory).length;
      }, [inventory]);

      const setCompletionPercentage = useMemo(() => {
        if (cards.length === 0) return 0;
        return ((uniqueCollectedCount / cards.length) * 100).toFixed(1);
      }, [uniqueCollectedCount, cards]);

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 flex flex-col">
          
          {/* TOP NAVBAR */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                  <i data-lucide="package-open" className="w-6 h-6 text-white"></i>
                </div>
                <div>
                  <h1 className="font-cinzel text-lg font-bold bg-gradient-to-r from-cyan-400 via-sky-200 to-indigo-300 bg-clip-text text-transparent">
                    RPG Set Booster Pack Simulator
                  </h1>
                  <p className="text-xs text-slate-400">Custom 100+ MTG RPG Set</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('booster')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all ${
                    activeTab === 'booster'
                      ? 'bg-cyan-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide="sparkles" className="w-4 h-4"></i> Open Boosters
                </button>
                <button
                  onClick={() => setActiveTab('collection')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all ${
                    activeTab === 'collection'
                      ? 'bg-cyan-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide="grid" className="w-4 h-4"></i> Collection Binder ({uniqueCollectedCount}/{cards.length})
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            
            {/* STATS DASHBOARD BAR */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
              <div className="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex items-center gap-3">
                <div className="p-2.5 rounded-lg bg-cyan-950 text-cyan-400 border border-cyan-800">
                  <i data-lucide="box" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="text-xs text-slate-400 font-medium">Packs Opened</span>
                  <p className="text-base font-bold text-slate-100">{stats.packsOpened}</p>
                </div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex items-center gap-3">
                <div className="p-2.5 rounded-lg bg-amber-950 text-amber-400 border border-amber-800">
                  <i data-lucide="crown" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="text-xs text-slate-400 font-medium">Mythics Found</span>
                  <p className="text-base font-bold text-amber-300">{stats.mythics}</p>
                </div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex items-center gap-3">
                <div className="p-2.5 rounded-lg bg-yellow-950 text-yellow-400 border border-yellow-800">
                  <i data-lucide="award" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="text-xs text-slate-400 font-medium">Rares Found</span>
                  <p className="text-base font-bold text-yellow-200">{stats.rares}</p>
                </div>
              </div>

              <div className="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex items-center gap-3">
                <div className="p-2.5 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800">
                  <i data-lucide="check-circle-2" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="text-xs text-slate-400 font-medium">Set Completed</span>
                  <p className="text-base font-bold text-emerald-300">{setCompletionPercentage}%</p>
                </div>
              </div>
            </div>

            {/* TAB 1: BOOSTER PACK OPENER */}
            {activeTab === 'booster' && (
              <div className="space-y-6">
                
                {/* Pack Mode Controls */}
                <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-semibold text-slate-300">Pack Logic Mode:</span>
                    <div className="inline-flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
                      <button
                        onClick={() => setPackMode('pure')}
                        className={`px-3 py-1 rounded-md transition-all ${
                          packMode === 'pure' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        15-Card Pure Mix
                      </button>
                      <button
                        onClick={() => setPackMode('draft')}
                        className={`px-3 py-1 rounded-md transition-all ${
                          packMode === 'draft' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        Balanced MTG Draft (1 Rare, 3 Unc, 10 Com, 1 Land)
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    {currentPack.length > 0 && (
                      <button
                        onClick={revealAll}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition"
                      >
                        Reveal All Cards
                      </button>
                    )}
                    <button
                      onClick={generateBoosterPack}
                      disabled={isOpeningAnim}
                      className="px-6 py-2.5 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-cinzel font-bold text-sm rounded-xl shadow-lg shadow-cyan-500/25 transition-all transform active:scale-95 disabled:opacity-50 flex items-center gap-2"
                    >
                      <i data-lucide="zap" className="w-4 h-4"></i> Open Booster Pack!
                    </button>
                  </div>
                </div>

                {/* Booster Pack Opening Stage */}
                {currentPack.length === 0 ? (
                  <div className="flex flex-col items-center justify-center p-12 border-2 border-dashed border-slate-800 rounded-2xl bg-slate-950/40 text-center min-h-[400px]">
                    {/* Animated Booster Foil Graphic */}
                    <div
                      onClick={generateBoosterPack}
                      className="cursor-pointer group relative w-56 h-80 rounded-2xl p-4 bg-gradient-to-br from-indigo-900 via-purple-950 to-slate-900 border-2 border-cyan-500/40 shadow-2xl flex flex-col justify-between items-center hover:scale-105 transition-transform duration-300 foil-effect"
                    >
                      <div className="w-full text-center py-2 bg-slate-950/70 rounded border border-cyan-500/30">
                        <span className="font-cinzel text-xs font-extrabold text-cyan-300 tracking-wider">15 CUSTOM CARDS</span>
                      </div>
                      
                      <div className="text-center my-auto">
                        <i data-lucide="box" className="w-16 h-16 text-cyan-400 mx-auto mb-2 group-hover:rotate-12 transition-transform"></i>
                        <h3 className="font-cinzel font-black text-xl text-white">RPG SET</h3>
                        <p className="text-[11px] text-cyan-200/70">Custom Magic Edition</p>
                      </div>

                      <div className="w-full text-center py-1.5 bg-cyan-600/90 text-white font-bold text-xs rounded shadow">
                        Click to Rip Open!
                      </div>
                    </div>
                    <p className="mt-4 text-xs text-slate-400">Click the booster pack above to simulate opening your first pack!</p>
                  </div>
                ) : (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="font-cinzel text-sm font-bold text-slate-300 flex items-center gap-2">
                        <i data-lucide="layers" className="w-4 h-4 text-cyan-400"></i> Opened Cards ({revealedIndices.size} / 15 Revealed)
                      </h2>
                      <span className="text-xs text-slate-400">Click any face-down card to reveal it!</span>
                    </div>

                    {/* Cards Grid / Fan View */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 justify-items-center">
                      {currentPack.map((card, idx) => {
                        const isRevealed = revealedIndices.has(idx);

                        return (
                          <div key={idx} className="relative">
                            {!isRevealed ? (
                              /* Face Down Card Back */
                              <div
                                onClick={() => revealCard(idx)}
                                className="w-56 h-[320px] rounded-xl bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 border-2 border-slate-700 p-4 flex flex-col justify-between items-center cursor-pointer shadow-xl hover:scale-105 hover:border-cyan-400 transition-all duration-300 group"
                              >
                                <div className="w-full text-right text-[10px] text-slate-500">Card #{idx + 1}</div>
                                <div className="w-20 h-28 rounded-full border-2 border-cyan-500/30 flex items-center justify-center bg-slate-950/60 group-hover:border-cyan-400 group-hover:shadow-lg group-hover:shadow-cyan-500/20 transition-all">
                                  <i data-lucide="help-circle" className="w-8 h-8 text-cyan-400"></i>
                                </div>
                                <span className="font-cinzel text-xs text-slate-300 font-semibold group-hover:text-cyan-300">
                                  Click to Reveal
                                </span>
                              </div>
                            ) : (
                              /* Revealed Card Component */
                              <CardDisplay card={card} size="md" />
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: COLLECTION BINDER GALLERY */}
            {activeTab === 'collection' && (
              <div className="space-y-6">
                
                {/* Search & Filter Header Bar */}
                <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex flex-wrap gap-3 items-center justify-between">
                  <div className="flex flex-wrap items-center gap-2">
                    
                    {/* Search Input */}
                    <div className="relative">
                      <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
                      <input
                        type="text"
                        placeholder="Search card name..."
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 w-44 sm:w-56"
                      />
                    </div>

                    {/* Rarity Filter */}
                    <select
                      value={filterRarity}
                      onChange={e => setFilterRarity(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500"
                    >
                      <option value="all">All Rarities</option>
                      <option value="mythic">Mythic</option>
                      <option value="rare">Rare</option>
                      <option value="uncommon">Uncommon</option>
                      <option value="common">Common</option>
                    </select>

                    {/* Color Filter */}
                    <select
                      value={filterColor}
                      onChange={e => setFilterColor(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500"
                    >
                      <option value="all">All Colors</option>
                      <option value="W">White (W)</option>
                      <option value="U">Blue (U)</option>
                      <option value="B">Black (B)</option>
                      <option value="R">Red (R)</option>
                      <option value="G">Green (G)</option>
                    </select>

                    {/* Type Filter */}
                    <select
                      value={filterType}
                      onChange={e => setFilterType(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500"
                    >
                      <option value="all">All Types</option>
                      <option value="Creature">Creature</option>
                      <option value="Land">Land</option>
                      <option value="Artifact">Artifact</option>
                      <option value="Instant">Instant</option>
                      <option value="Sorcery">Sorcery</option>
                      <option value="Enchantment">Enchantment</option>
                      <option value="Planeswalker">Planeswalker</option>
                      <option value="Vehicle">Vehicle</option>
                    </select>
                  </div>

                  <div className="text-xs text-slate-400">
                    Showing <span className="text-cyan-400 font-bold">{filteredCollection.length}</span> of {cards.length} cards
                  </div>
                </div>

                {/* Collection Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center">
                  {filteredCollection.map(card => {
                    const count = inventory[card.name] || 0;
                    const isCollected = count > 0;

                    return (
                      <div key={card.id} className="relative group">
                        
                        {/* Quantity Badge */}
                        <div className="absolute -top-2 -right-2 z-20 bg-cyan-600 text-white font-extrabold font-mono text-xs px-2 py-0.5 rounded-full shadow-lg border border-cyan-300">
                          x{count}
                        </div>

                        {/* Card Component with Unowned Graying Effect */}
                        <div className={!isCollected ? "opacity-35 grayscale hover:grayscale-0 transition-all duration-300" : ""}>
                          <CardDisplay card={card} size="md" />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Render React Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
